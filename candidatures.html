<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes candidatures de stage et d'emploi | Matching Up</title>
    <meta name="description" content="Retrouvez les offres de stage et d&#x27;emploi auxquelles vous avez postulé, retirez celles que vous ne voulez pas, puis passez à la commande." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <p class="logo">Matching Up</p>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="candidat.html">Candidats</a>
        <a href="entreprise.html">Entreprises</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Mes candidatures</h1>
        <p>Les offres auxquelles tu as postulé, avant de passer à la commande.</p>
      </section>
      <section class="contenu">
        <h2>Offres sélectionnées</h2>
        <div id="liste"></div>
        <p id="actions" style="text-align:center" hidden>
          <button type="button" id="commander">Passer à la commande</button>
        </p>
      </section>
    </main>

    <footer>© 2026 Matching Up — Démonstration : aucune donnée réelle, aucun paiement.</footer>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
      function afficher() {
        const panier = getCart();
        const liste = document.getElementById("liste");
        if (panier.length === 0) {
          liste.innerHTML = '<p style="text-align:center">Tu n\'as pas encore postulé.</p>' +
            '<p style="text-align:center"><a class="button" href="candidat.html">Découvrir les offres</a></p>';
          document.getElementById("actions").hidden = true;
          return;
        }
        liste.innerHTML = panier.map(function (o) {
          return '<article class="job-card ligne-panier"><div><h3>' + echapperHtml(o.titre) + "</h3>" +
            "<p>" + echapperHtml(o.entreprise) + ' — <span class="tag">' + echapperHtml(o.type) + "</span></p></div>" +
            '<button type="button" class="secondary retirer" data-titre="' + echapperHtml(o.titre) + '">Retirer</button></article>';
        }).join("") + '<p style="text-align:center"><strong>' + panier.length + " offre(s)</strong></p>";
        document.getElementById("actions").hidden = false;
      }
      document.getElementById("liste").addEventListener("click", function (e) {
        const b = e.target.closest(".retirer");
        if (b) { retirerDuPanier(b.dataset.titre); afficher(); }
      });
      document.getElementById("commander").addEventListener("click", function () {
        if (getCart().length === 0) return; // pas de commande avec un panier vide
        // Si pas connecté : on garde le panier et on revient au checkout après la connexion
        window.location.href = getCurrentUser() ? "checkout.html" : "connexion.html?retour=checkout.html";
      });
      afficher();
    </script>
  </body>
</html>
